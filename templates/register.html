<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 25px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .container {
            width: 100%; max-width: 460px; background: #fff;
            padding: 35px; border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,.20);
        }
        h1 { margin: 0 0 8px; text-align: center; color: #222; }
        .subtitle { text-align: center; color: #777; margin: 0 0 28px; }
        label { display: block; margin: 16px 0 7px; font-weight: 600; color: #333; }
        input, select {
            width: 100%; padding: 13px 14px; border: 1px solid #d6d6d6;
            border-radius: 9px; font-size: 15px; outline: none;
        }
        input:focus, select:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.12); }
        button {
            width: 100%; margin-top: 24px; padding: 13px;
            border: 0; border-radius: 9px; background: #667eea;
            color: white; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #5568d8; }
        .link { display: block; text-align: center; margin-top: 20px; color: #667eea; text-decoration: none; font-weight: 600; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Register for the secure authentication system</p>

    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="full_name" placeholder="Enter your full name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" name="password" minlength="8" placeholder="Minimum 8 characters" required>

        <label>Role</label>
        <select name="role">
            <option value="student">Student</option>
            <option value="instructor">Instructor</option>
        </select>

        <button type="submit">Create Account</button>
    </form>

    <a class="link" href="/login">Already have an account? Login</a>
</div>
</body>
</html>
