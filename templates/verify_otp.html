<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 25px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .container {
            width: 100%; max-width: 430px; background: white;
            padding: 35px; border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,.20); text-align: center;
        }
        .icon {
            width: 65px; height: 65px; margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: #eef0ff; font-size: 30px;
        }
        h1 { margin: 0 0 10px; color: #222; }
        p { color: #777; line-height: 1.5; }
        input {
            width: 100%; margin-top: 18px; padding: 15px;
            border: 1px solid #d6d6d6; border-radius: 9px;
            font-size: 24px; text-align: center; letter-spacing: 8px;
            outline: none;
        }
        input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.12); }
        button {
            width: 100%; margin-top: 20px; padding: 13px;
            border: 0; border-radius: 9px; background: #667eea;
            color: white; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #5568d8; }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">✉️</div>
    <h1>Email Verification</h1>
    <p>Enter the 6-digit OTP sent to your email address.</p>

    <form method="POST">
        <input type="text" name="otp" maxlength="6" minlength="6"
               pattern="[0-9]{6}" inputmode="numeric"
               placeholder="123456" required>
        <button type="submit">Verify OTP</button>
    </form>
</div>
</body>
</html>
